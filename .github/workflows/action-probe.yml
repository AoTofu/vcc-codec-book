name: Action write probe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/action-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write probe marker
        run: |
          printf 'GitHub Actions write probe succeeded.\n' > action-probe.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add action-probe.txt
          git commit -m 'Confirm Actions write access'
          git push
