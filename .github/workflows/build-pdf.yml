name: Build and publish PDF

on:
  push:
    branches:
      - main
    paths:
      - 'source-parts/**'
      - '.github/workflows/build-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build PDF with diagnostics
        id: build
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            sudo apt-get update &&
            sudo apt-get install -y --no-install-recommends \
              latexmk \
              texlive-xetex \
              texlive-lang-japanese \
              texlive-lang-chinese \
              texlive-latex-extra \
              texlive-pictures \
              texlive-fonts-recommended \
              fonts-noto-core \
              fonts-noto-cjk \
              fonts-noto-mono \
              poppler-utils \
              unzip &&
            fc-cache -f &&
            fc-match 'Noto Sans' &&
            fc-match 'Noto Sans CJK JP' &&
            fc-match 'Noto Sans Mono' &&
            cat source-parts/part-*.b64 | base64 --decode > source.zip &&
            echo 'da6702fce07a58613882db5fe2fd541639f264a1078be1a03ffbba22439ea293  source.zip' | sha256sum -c - &&
            rm -rf build-src &&
            mkdir build-src &&
            unzip -q source.zip -d build-src &&
            cd build-src/VCC_codec_for_kids_LaTeX &&
            latexmk -xelatex -interaction=nonstopmode -halt-on-error main.tex &&
            cp main.pdf "$GITHUB_WORKSPACE/VCC_codec_for_kids.pdf" &&
            cd "$GITHUB_WORKSPACE" &&
            test "$(pdfinfo VCC_codec_for_kids.pdf | awk '/^Pages:/ {print $2}')" = '70' &&
            pdffonts VCC_codec_for_kids.pdf &&
            pdftoppm -f 1 -singlefile -png -r 140 VCC_codec_for_kids.pdf cover &&
            test -s cover.png &&
            sha256sum VCC_codec_for_kids.pdf cover.png
          } 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            printf 'success\n' > build-status.txt
          else
            printf 'failed: exit code %s\n' "$rc" > build-status.txt
          fi
          tail -n 240 build.log > build-log-tail.txt
          exit 0

      - name: Commit generated files or diagnostics
        shell: bash
        run: |
          git pull --rebase origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-status.txt build-log-tail.txt
          if [ '${{ steps.build.outputs.exit_code }}' = '0' ]; then
            git add VCC_codec_for_kids.pdf cover.png
          fi
          if git diff --cached --quiet; then
            echo 'No generated changes to publish.'
            exit 0
          fi
          git commit -m 'Build published PDF'
          git push

      - name: Mark workflow failed when the build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
